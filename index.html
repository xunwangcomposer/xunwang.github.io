<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Xun Wang | Composer</title>

    <meta name="description"
          content="Official portfolio of composer Xun Wang. Contemporary classical music, scores, recordings, biography and works.">

    <meta name="keywords"
          content="Xun Wang, Composer, Manhattan School of Music, Contemporary Music, Portfolio">

    <meta name="author"
          content="Xun Wang">

    <link rel="icon"
          href="favicon.ico">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <!-- Handwriting -->

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;700&family=Inter:wght@300;400;500;600&family=Great+Vibes&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/glass.css">

    <link rel="stylesheet"
          href="css/animation.css">

    <link rel="stylesheet"
          href="css/responsive.css">

</head>

<body>

<!-- ===================================================== -->
<!-- Background                                             -->
<!-- ===================================================== -->
<div class="background-layer">

    <img
        class="background-image"
        src="assets/images/background.jpg"
        alt="Background">

    <div class="hero-bloom"></div>

    <div id="petals"></div>

    <div class="background-overlay"></div>

    <div class="background-noise"></div>

</div>

<!-- ===================================================== -->
<!-- Header                                                 -->
<!-- ===================================================== -->

<header class="top-bar">

    <button class="menu-button">

        <span></span>

        <span></span>

        <span></span>

    </button>

</header>

<!-- ===================================================== -->
<!-- Hero                                                   -->
<!-- ===================================================== -->

<main class="hero">

    <section class="hero-left">

        <div class="hero-content fade-up">

            <h1 class="hero-name">

                Xun Wang

            </h1>

            <h2 class="hero-title">

                COMPOSER

            </h2>

            <div class="hero-divider"></div>

            <p class="hero-description">

                Creating music that speaks<br>
                between silence and sound.

            </p>
                        <!-- ========================= -->
            <!-- Glass Menu -->
            <!-- ========================= -->

            <nav class="glass-menu">

                <ul>

                    <li class="active">
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="biography.html">Biography</a>
                    </li>

                    <li>
                        <a href="works.html">Works</a>
                    </li>

                    <li>
                        <a href="cv.html">CV</a>
                    </li>

                </ul>

                <div class="social-icons">

                    <a href="https://youtube.com/"
                       target="_blank"
                       aria-label="YouTube">

                        <i class="fa-brands fa-youtube"></i>

                    </a>

                    <a href="https://instagram.com/"
                       target="_blank"
                       aria-label="Instagram">

                        <i class="fa-brands fa-instagram"></i>

                    </a>

                    <a href="mailto:your@email.com"
                       aria-label="Email">

                        <i class="fa-regular fa-envelope"></i>

                    </a>

                </div>

            </nav>

        </div>

    </section>

<!-- ================================= -->
<!-- Right Hero -->
<!-- ================================= -->

<section class="hero-right">

    <div class="hero-art">

        <!-- Bloom -->
        <div class="hero-glow"></div>

        <!-- Shadow -->
        <div class="hero-shadow"></div>

    </div>

</section>

</main>

<!-- ========================= -->
<!-- Scroll -->
<!-- ========================= -->

<div class="scroll-indicator">

    <span>

        SCROLL

    </span>

    <div class="scroll-line"></div>

</div>

<!-- ========================= -->
<!-- Footer -->
<!-- ========================= -->

<footer class="copyright">

    © 2026 Xun Wang. All rights reserved.

</footer>
<!-- ===================================== -->
<!-- Background Music -->
<!-- ===================================== -->

<audio id="backgroundMusic"
       loop
       preload="auto">

    <source src="assets/audio/background.mp3"
            type="audio/mpeg">

</audio>

<!-- ===================================== -->
<!-- Page Loader -->
<!-- ===================================== -->

<div id="loader">

    <div class="loader-circle"></div>

    <div class="loader-text">

        Xun Wang

    </div>

</div>

<!-- ===================================== -->
<!-- Custom Cursor -->
<!-- ===================================== -->

<div class="cursor"></div>

<div class="cursor-blur"></div>

<!-- ===================================== -->
<!-- Decorative Layers -->
<!-- ===================================== -->

<div class="ambient-light light-one"></div>

<div class="ambient-light light-two"></div>

<div class="ambient-light light-three"></div>

<!-- ===================================== -->
<!-- Hidden Hero Overlay -->
<!-- ===================================== -->

<div class="hero-mask"></div>

<!-- ============================================== -->
<!-- Scripts -->
<!-- ============================================== -->

<script src="js/main.js"></script>
<script src="js/menu.js"></script>
<script src="js/theme.js"></script>
<script src="js/parallax.js"></script>
<script src="js/liquid.js"></script>
<script src="js/petals.js"></script>
<script src="js/animation.js"></script>

<!-- ============================================== -->
<!-- Initialize -->
<!-- ============================================== -->

<script>

document.addEventListener("DOMContentLoaded", () => {

    // Theme
    if (typeof initTheme === "function") {
        initTheme();
    }

    // Menu
    if (typeof initMenu === "function") {
        initMenu();
    }

    // Mouse Parallax
    if (typeof initParallax === "function") {
        initParallax();
    }

    // Floating Petals
    if (typeof createPetals === "function") {
        createPetals();
    }

    // Page Animation
    if (typeof pageAnimation === "function") {
        pageAnimation();
    }

});

</script>

</body>
</html>
